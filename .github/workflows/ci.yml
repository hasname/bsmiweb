name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: make assets
      - run: git diff --exit-code internal/web/static

  migrations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -ptest
          - image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: test
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/db
        env:
          BSMI_TEST_MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/
