---
- hosts: web
  vars:
    home_dir: "{{ ansible_facts['user_dir'] }}"
    deploy_path: "{{ home_dir }}/bsmiweb"
    systemd_user_dir: "{{ home_dir }}/.config/systemd/user"
    services: [bsmiweb.service, bsmiweb-cron.service]
    systemd_user_env:
      XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['user_uid'] }}/bus"
  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ deploy_path }}"
        state: directory
        mode: "0755"

    - name: Upload the next binary
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../dist/bsmiweb"
        dest: "{{ deploy_path }}/bsmiweb.next"
        owner: false
        group: false

    - name: Copy .env file
      ansible.builtin.copy:
        src: "{{ dotenv_file }}"
        dest: "{{ deploy_path }}/.env"
        mode: "0600"
      no_log: true

    - name: Inspect existing user services
      ansible.builtin.command:
        argv: [systemctl, --user, show, "{{ item }}", --property=LoadState, --value]
      loop: "{{ services }}"
      register: existing_services
      changed_when: false
      environment: "{{ systemd_user_env }}"

    - name: Stop existing writers before database migration
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        state: stopped
        scope: user
      loop: "{{ existing_services.results }}"
      when: item.stdout | trim != 'not-found'
      environment: "{{ systemd_user_env }}"

    # A failed migration deliberately leaves services stopped. Do not hide the
    # error or restart an old writer against a partially migrated schema.
    - name: Verify Prisma history and run database migrations
      ansible.builtin.command:
        cmd: ./bsmiweb.next migrate
        chdir: "{{ deploy_path }}"
      environment:
        NODE_ENV: production
      changed_when: false

    - name: Inspect the previous Go binary
      ansible.builtin.stat:
        path: "{{ deploy_path }}/bsmiweb"
      register: previous_binary

    - name: Keep the previous Go binary for rollback
      ansible.builtin.copy:
        src: "{{ deploy_path }}/bsmiweb"
        dest: "{{ deploy_path }}/bsmiweb.previous"
        remote_src: true
        mode: "0755"
      when: previous_binary.stat.exists

    - name: Activate the new binary
      ansible.builtin.command:
        argv: [mv, "{{ deploy_path }}/bsmiweb.next", "{{ deploy_path }}/bsmiweb"]
      changed_when: true

    - name: Create systemd user directory
      ansible.builtin.file:
        path: "{{ systemd_user_dir }}"
        state: directory
        mode: "0755"

    - name: Install systemd user service files
      ansible.builtin.template:
        src: "{{ playbook_dir }}/{{ item }}.j2"
        dest: "{{ systemd_user_dir }}/{{ item }}"
        mode: "0644"
      loop: "{{ services }}"

    - name: Reload systemd user daemon
      environment: "{{ systemd_user_env }}"
      ansible.builtin.systemd_service:
        daemon_reload: true
        scope: user

    - name: Enable and restart bsmiweb services
      environment: "{{ systemd_user_env }}"
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
        enabled: true
        scope: user
      loop: "{{ services }}"

    - name: Wait for the web server and database
      ansible.builtin.command:
        cmd: ./bsmiweb healthcheck
        chdir: "{{ deploy_path }}"
      register: health
      changed_when: false
      until: health.rc == 0
      retries: 10
      delay: 2
